# The Prometheus exporter runs separately (same image, `python exporter.py`)
# and reads this data directory read-only - see README.

services:
  network-probe-sidecar:
    build: .
    image: nataannn/network-probe-sidecar:latest
    container_name: network-probe-sidecar
    restart: unless-stopped
    env_file:
      - .env
    # ICMP (ping) and traceroute need raw sockets - grant only what's needed
    # instead of running the container as privileged.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./config/targets.yaml:/app/config/targets.yaml:ro
      - ./data:/data/probes