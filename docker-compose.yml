# The collector runs here on the probe VM and writes to ./data.
# The Prometheus exporter runs in the trygon-monitoring stack and reads
# this data over NFS — it is intentionally NOT defined in this compose.

services:
  network-probe-sidecar:
    build: .
    image: nataannn/network-probe-sidecar:latest
    container_name: network-probe-sidecar
    restart: unless-stopped
    env_file:
      - .env
    # ICMP (ping) and traceroute need raw sockets - grant only what's needed
    # instead of running the container as privileged.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./config/targets.yaml:/app/config/targets.yaml:ro
      - ./data:/data/probes