services:
  network-probe-sidecar:
    build: .
    image: nataannn/network-probe-sidecar:latest
    container_name: network-probe-sidecar
    restart: unless-stopped
    env_file:
      - .env
    # ICMP (ping) and traceroute need raw sockets - grant only what's needed
    # instead of running the container as privileged.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./config/targets.yaml:/app/config/targets.yaml:ro
      - probe-data:/data/probes

  network-probe-exporter:
    build: .
    image: nataannn/network-probe-sidecar:latest
    container_name: network-probe-exporter
    restart: unless-stopped
    command: ["python", "exporter.py"]
    environment:
      METRICS_PORT: ${EXPORTER_PORT:-9200}
      COLLECT_INTERVAL: ${INTERVAL_SECONDS:-30}
      DATA_DIR: /data/probes
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${EXPORTER_PORT:-9200}:9200"
    volumes:
      - probe-data:/data/probes:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9200/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - network-probe-sidecar

volumes:
  probe-data:
    driver: local

