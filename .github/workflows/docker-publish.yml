name: Build and Push Docker Image

on:
  push:
    branches:
      - main        # publishes as "latest" on every push to main
    tags:
      - "v*.*.*"    # publishes as versioned tag (e.g. v1.0.0) on git tag push

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Extract metadata (tags and labels) for the image
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: nataannn/network-probe-sidecar
          tags: |
            # push to main → tag as "latest"
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # push a git tag v1.2.3 → tag as "v1.2.3" and "1.2.3"
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # 4. Set up Docker Buildx (enables multi-platform builds and cache)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build and push the image
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha       # use GitHub Actions cache to speed up builds
          cache-to: type=gha,mode=max